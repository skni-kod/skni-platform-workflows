name: Docker Build

# Builds and pushes a Docker image. Does NOT create any git tag – pass an
# existing version via the `tag` input (e.g. from create-date-tag.yaml). For PR
# validation set push: false.

on:
  workflow_call:
    inputs:
      commit_id:
        description: 'Git commit SHA to build (e.g. a1b2c3d).'
        required: true
        type: string
      image_name:
        description: 'The target name for the Docker image (e.g. my-microservice).'
        required: true
        type: string
      dockerfile_path:
        description: 'Path to the Dockerfile within the repository (e.g. ./Dockerfile).'
        required: false
        default: Dockerfile
        type: string
      tag:
        description: 'Version tag applied to the image (e.g. 2026.08.14.1).'
        required: true
        type: string
      push:
        description: 'Whether to push the built image to the container registry.'
        required: false
        default: true
        type: boolean
      lint_dockerfile:
        description: 'Whether to run Hadolint to validate the Dockerfile.'
        required: false
        default: true
        type: boolean
      target:
        description: 'Target build stage to build for multi-stage Dockerfiles.'
        required: false
        type: string
      build_args:
        description: 'Additional build arguments passed to Docker, key=value pairs (one per line).'
        required: false
        type: string
      provenance:
        description: 'Whether to generate provenance attestation.'
        required: false
        default: false
        type: boolean
      sbom:
        description: 'Whether to generate SBOM attestation.'
        required: false
        default: false
        type: boolean
    secrets:
      build_secrets:
        description: 'Sensitive data (like NPM tokens) passed to the Docker build process using --mount=type=secret.'
        required: false
    outputs:
      image_tag:
        description: 'The tag applied to the image.'
        value: ${{ jobs.build.outputs.image_tag }}

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_id }}

      - name: Validate input parameters
        run: |
          echo "Input parameters validation..."

          if [[ ! "${{ inputs.commit_id }}" =~ ^[a-f0-9]{7,40}$ ]]; then
            echo "::error title=Incorrect commit_id::Parameter commit_id ('${{ inputs.commit_id }}') has incorrect format. Required hash SHA."
            exit 1
          fi

          if [[ ! "${{ inputs.image_name }}" =~ ^[a-z0-9_.-]+$ ]]; then
            echo "::error title=Incorrect image name::Parameter image_name ('${{ inputs.image_name }}') is incorrect. Use only small case, numbers, hyphens and dots."
            exit 1
          fi

          if [[ ! -f "${{ inputs.dockerfile_path }}" ]]; then
            echo "::error title=No Dockerfile::Cannot find Dockerfile in path: '${{ inputs.dockerfile_path }}'"
            exit 1
          fi

          echo "All parameters are correct."

      - name: Lint Dockerfile with Hadolint tool
        if: ${{ inputs.lint_dockerfile }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.dockerfile_path }}
          failure-threshold: warning
          verbose: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=sha-${{ inputs.commit_id }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: ${{ inputs.dockerfile_path }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build_args }}
          secrets: ${{ secrets.build_secrets }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ inputs.provenance }}
          sbom: ${{ inputs.sbom }}
