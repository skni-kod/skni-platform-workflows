name: Changelog / Release (reusable)

# Generates a changelog between the previous build/* tag and the given (or
# auto-detected latest) build/* tag, then creates a GitHub Release. Commit
# messages are listed as-is (no Conventional Commits required). The release
# notes include a "Full Changelog" link that compares the previous and current
# tag, so clicking the tag shows what changed between the two.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to generate changelog for (e.g. build/2026.08.14.1). Auto-detected if omitted.'
        required: false
        type: string
      release_name:
        description: 'Release title. Defaults to the tag name.'
        required: false
        type: string
      create_release:
        description: 'Create a GitHub Release with the generated changelog.'
        required: false
        default: true
        type: boolean
      update_changelog_file:
        description: 'Commit an updated CHANGELOG.md into the default branch of the caller repo.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --prune --unshallow --tags 2>/dev/null || git fetch --prune --tags 2>/dev/null || true

      - name: Resolve tags
        id: get_tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            CURRENT="${{ inputs.tag }}"
          else
            CURRENT=$(git tag --list 'build/*' --sort=-creatordate | head -n1)
          fi
          if [ -z "${CURRENT:-}" ]; then
            echo "::error::No build/* tag found and no 'tag' input provided."
            exit 1
          fi
          PREV=$(git tag --list 'build/*' --sort=-creatordate | sed -n '2p')
          if [ -z "${PREV:-}" ]; then
            echo "is_first_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_first_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "new_tag=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        id: generate_notes
        shell: bash
        run: |
          set -euo pipefail
          latest="${{ steps.get_tag.outputs.latest_tag }}"
          current="${{ steps.get_tag.outputs.new_tag }}"
          is_first="${{ steps.get_tag.outputs.is_first_release }}"

          if [ "$is_first" = "true" ]; then
            range=""
          else
            range="$latest..$current"
          fi

          commits=$(git log $range --pretty=format:"%s (%h) - @%an")

          echo "## What's Changed" > notes.txt

          if [ -n "$commits" ]; then
            echo "$commits" | sed -E 's/^/- /' >> notes.txt
          fi

          if [ "$is_first" = "true" ]; then
            echo -e "\n---\n\n📜 [Full Changelog](https://github.com/${{ github.repository }}/commits/${current})" >> notes.txt
          else
            echo -e "\n---\n\n📜 [Full Changelog](https://github.com/${{ github.repository }}/compare/${latest}...${current})" >> notes.txt
          fi

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.get_tag.outputs.new_tag }}" \
            --title "${{ inputs.release_name || steps.get_tag.outputs.new_tag }}" \
            --notes-file notes.txt

      - name: Commit CHANGELOG.md to default branch
        if: ${{ inputs.update_changelog_file }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEFAULT_BRANCH=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          cp notes.txt CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout "${DEFAULT_BRANCH}"
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG for ${{ steps.get_tag.outputs.new_tag }}" || echo "nothing to commit"
          git push origin "${DEFAULT_BRANCH}"
