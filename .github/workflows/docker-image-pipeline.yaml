name: Docker Image Pipeline

# Convenience wrapper that composes the smaller reusable workflows:
#   - create-date-tag.yaml   (git tag build/YYYY.MM.DD.N)
#   - docker-build.yaml      (build & push image)
#   - changelog.yaml         (changelog + GitHub Release)
#
# Skip parts via inputs:
#   build_image: false     -> only tag (+ optional changelog), no image build
#   create_release: false  -> no changelog / GitHub Release
# To build an image WITHOUT any git tag, call docker-build.yaml directly.

on:
  workflow_call:
    inputs:
      commit_id:
        description: 'Git commit SHA used for checking out the code and tagging the image (e.g., a1b2c3d).'
        required: true
        type: string
      image_name:
        description: 'The target name or tag for the Docker image (e.g., my-microservice).'
        required: true
        type: string
      dockerfile_path:
        description: 'Path to the Dockerfile within the repository (e.g., ./Dockerfile).'
        required: false
        default: 'Dockerfile'
        type: string
      push:
        description: 'Whether to push the built image to the container registry.'
        required: false
        default: true
        type: boolean
      lint_dockerfile:
        description: 'Whether to run Hadolint to validate the Dockerfile.'
        required: false
        default: true
        type: boolean
      target:
        description: 'Target build stage to build for multi-stage Dockerfiles (e.g., production).'
        required: false
        type: string
      build_args:
        description: 'Additional build arguments passed to Docker, formatted as key=value pairs (one per line).'
        required: false
        type: string
      provenance:
        description: 'Whether to generate provenance attestation.'
        required: false
        default: false
        type: boolean
      sbom:
        description: 'Whether to generate SBOM attestation.'
        required: false
        default: false
        type: boolean
      build_image:
        description: 'Whether to build and push the Docker image. Set false to only create the tag (and optionally the changelog).'
        required: true
        type: boolean
      create_release:
        description: 'Whether to generate a changelog and create a GitHub Release.'
        required: true
        type: boolean
    secrets:
      build_secrets:
        description: 'Sensitive data (like NPM tokens) passed to the Docker build process using --mount=type=secret.'
        required: false
    outputs:
      image_tag:
        description: 'The version/tag applied to the image and git tag.'
        value: ${{ jobs.tag.outputs.version }}
      tag:
        description: 'The full git tag (e.g. build/2026.08.14.1).'
        value: ${{ jobs.tag.outputs.tag }}

permissions:
  contents: write

jobs:
  tag:
    uses: ./.github/workflows/create-date-tag.yaml
    with:
      commit_id: ${{ inputs.commit_id }}

  build:
    needs: tag
    if: ${{ inputs.build_image }}
    uses: ./.github/workflows/docker-build.yaml
    with:
      commit_id: ${{ inputs.commit_id }}
      image_name: ${{ inputs.image_name }}
      dockerfile_path: ${{ inputs.dockerfile_path }}
      tag: ${{ needs.tag.outputs.version }}
      push: ${{ inputs.push }}
      lint_dockerfile: ${{ inputs.lint_dockerfile }}
      target: ${{ inputs.target }}
      build_args: ${{ inputs.build_args }}
      provenance: ${{ inputs.provenance }}
      sbom: ${{ inputs.sbom }}
    secrets:
      build_secrets: ${{ secrets.build_secrets }}

  changelog:
    needs: tag
    if: ${{ inputs.create_release }}
    uses: ./.github/workflows/changelog.yaml
    with:
      tag: ${{ needs.tag.outputs.tag }}
